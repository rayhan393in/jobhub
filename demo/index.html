<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobHub — রুটিন PDF ডেমো (লাইভ ডেটা)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#232e7a; --yellow:#f7d64a; --dateblue:#dbeafe; }
  * { box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  body { font-family:"Hind Siliguri",sans-serif; margin:0; background:#f1f2f6; color:#111; }
  .sheet { max-width:820px; margin:0 auto; background:#fff; padding:24px; }
  .toolbar { max-width:820px; margin:12px auto; display:flex; justify-content:space-between; align-items:center;
    background:#fafafa; border:1px solid #ddd; border-radius:10px; padding:8px 12px; font-size:.75rem; }
  .toolbar button { background:#111; color:#fff; border:0; border-radius:8px; padding:7px 14px; font-weight:700; cursor:pointer; font-family:inherit; }
  .banner { background:var(--navy); border:2px solid var(--navy); border-radius:10px 10px 0 0; text-align:center; padding:10px 16px; }
  .banner h1 { margin:0; color:#fff; font-size:1.125rem; }
  .banner p { margin:2px 0 0; color:#c7d2fe; font-size:.75rem; font-weight:600; }
  .meta { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px;
    border-left:2px solid var(--navy); border-right:2px solid var(--navy); background:#eef1fb; padding:8px 12px; }
  .legend { display:flex; gap:6px; flex-wrap:wrap; }
  .pill { border-radius:999px; padding:2px 10px; font-size:.625rem; font-weight:700; }
  .meta small { color:#555; font-size:.625rem; }
  table { width:100%; border-collapse:collapse; font-size:.75rem; border:2px solid var(--navy); }
  th { background:var(--yellow); border:1px solid var(--navy); padding:6px 8px; font-size:.6875rem; }
  td { border:1px solid var(--navy); padding:6px 8px; vertical-align:middle; }
  tr { break-inside:avoid; }
  td.date { background:var(--dateblue); text-align:center; width:15%; }
  td.date b { font-size:.75rem; } td.date span { display:block; font-size:.5625rem; color:#555; }
  td.dayno { text-align:center; width:12%; font-weight:700; }
  .examtag { display:inline-block; margin-top:2px; background:#fcd9e0; border:1px solid #e11d48; color:#73102a;
    border-radius:999px; padding:0 6px; font-size:.5625rem; font-weight:700; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chip { border-radius:6px; padding:4px 8px; font-size:.6875rem; line-height:1.35; border:1.5px solid; }
  .chip b { font-weight:700; } .chip i { opacity:.8; font-style:normal; }
  .study { background:#c9f0ec; border-color:#0d9488; color:#0f3d3a; }
  .practice { background:#e5e0fb; border-color:#7c3aed; color:#3b2b70; }
  .revision { background:#fdeec3; border-color:#d97706; color:#6b4304; }
  .exam { background:#fcd9e0; border-color:#e11d48; color:#73102a; }
  .section { margin-bottom:28px; }
  .note { max-width:820px; margin:8px auto 24px; font-size:.625rem; color:#666; text-align:center; }
  @media print { .toolbar,.note { display:none; } body { background:#fff; } .sheet { padding:0; max-width:none; } }
</style>
</head>
<body>
<div class="toolbar">
  <span>এটি <b>লাইভ ডাটাবেসের আসল রুটিন ডেটা</b> দিয়ে বানানো PDF ডেমো — প্রিন্ট ডায়ালগে “Save as PDF” + “Background graphics” অন রাখুন।</span>
  <button onclick="window.print()">PDF হিসেবে সেভ করুন</button>
</div>

<div class="sheet">
  <div class="section" id="bcs"></div>
  <div class="section" id="pb"></div>
</div>
<p class="note">ডেমোতে প্রতি কোর্সের প্রথম কয়েকদিন দেখানো হয়েছে — আসল PDF-এ পুরো মেয়াদ থাকে। কোনো সময়/মিনিট ও ফিলার-রিভিশন রো নেই (আপনার নির্দেশমতো)।</p>

      { s:"গাণিতিক যুক্তি", k:"study", t:"বাস্তব সংখ্যা", x:"অমূলদ রাশি, সংখ্যার শ্রেণি, ক্রমিক পূর্ণসংখ্যা, অঙ্কবিন্যাস, মৌলিক উৎপাদক, যৌগিক সংখ্যা" },
    ]},
  ],

const PB = {
  title: "JobHub — প্রকাশিত স্টাডি রুটিন",

  days: [
    { d:"2026-11-24", tasks:[

      { s:"আন্তর্জাতিক বিষয়াবলি", k:"study", t:"আন্তর্জাতিক সংস্থা", x:"জাতিসংঘ ও সংস্থাসমূহ" },

    { d:"2026-11-26", tasks:[

      { s:"ইংরেজি", k:"study", t:"ইংরেজি অনুশীলন (লিখিত অনুশীলনসহ)", x:"" },

const KIND_LABEL = { study:"পড়া", practice:"প্র্যাকটিস", revision:"রিভিশন", exam:"পরীক্ষা" };
const bnDate = (d) => new Intl.DateTimeFormat("bn-BD",{day:"numeric",month:"numeric",year:"2-digit"}).format(new Date(d+"T12:00:00"));
const bnDay  = (d) => new Intl.DateTimeFormat("bn-BD",{weekday:"long"}).format(new Date(d+"T12:00:00"));
const bnNum  = (n) => new Intl.NumberFormat("bn-BD").format(n);

function render(el, data) {
  const kinds = [...new Set(data.days.flatMap(day => day.tasks.map(t => t.k)))];
  let html = `
    <div class="banner"><h1>${data.title}</h1><p>${data.course}</p></div>
    <div class="meta">
      <div class="legend">${kinds.map(k=>`<span class="pill ${k}">${KIND_LABEL[k]??k}</span>`).join("")}</div>
      <small>ডেমো — লাইভ ডাটাবেস থেকে</small>
    </div>
    <table><thead><tr><th style="width:15%">তারিখ</th><th style="width:12%">দিন / পরীক্ষা</th><th>টপিকস</th></tr></thead><tbody>`;
  data.days.forEach((day, i) => {
    const hasExam = day.tasks.some(t => t.k === "exam");
    html += `<tr>
      <td class="date"><b>${bnDate(day.d)}</b><span>${bnDay(day.d)}</span></td>
      <td class="dayno">D-${bnNum(i+1)}${hasExam ? '<br><span class="examtag">পরীক্ষা</span>' : ""}</td>
      <td><div class="chips">${day.tasks.map(t =>
        `<span class="chip ${t.k}">${t.s ? `<b>${t.s}: </b>` : ""}${t.t}${t.x ? ` <i>(${t.x})</i>` : ""}</span>`
      ).join("")}</div></td>
    </tr>`;
  });
  html += `</tbody></table>`;
  el.innerHTML = html;
}
render(document.getElementById("bcs"), BCS);
render(document.getElementById("pb"), PB);

</body>
</html>
