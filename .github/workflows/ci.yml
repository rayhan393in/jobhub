name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, unit + database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The database suites boot a real PostgreSQL in-process (PGlite) and run
      # every migration, so schema, RLS and the exam engine are verified without
      # needing Supabase credentials.
      - name: Tests (unit + database)
        run: npm test

      # No database credentials in CI: the migrator skips and the build runs
      # exactly as it does on a machine without Supabase access.
      - name: Production build
        run: npm run build
        env:
          # Build-time placeholders only: nothing is called during a build, and
          # real values are injected by the hosting provider at runtime.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_TELEMETRY_DISABLED: "1"
